<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e13" />
    <meta name="description" content="NetPulse — PWA 网络探测工具：公网 IP 检测与域名/IP 可达性探测，支持 IPv4/IPv6 与强制 IPv4。" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.ipify.org https://api4.ipify.org https://api6.ipify.org https://api64.ipify.org https://ipinfo.io https://ipv4.icanhazip.com https://ipv6.icanhazip.com https://cloudflare-dns.com https://dns.google http: https:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>NetPulse — 网络探测工具</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="pulse-dot" aria-hidden="true"></span>
        <h1>NetPulse</h1>
        <p class="tagline">公网 IP 检测 · 可达性探测</p>
      </div>
      <span id="version-badge" class="version-badge">v5</span>
    </header>

    <main class="app-main">
      <section class="card">
        <div class="card-head">
          <h2>公网 IP</h2>
          <button id="detect-btn" class="btn" type="button">检测</button>
        </div>
        <p class="hint">多源并行查询，取多数共识，IPv4 / IPv6 分开出示。</p>
        <div id="ip-output" class="output"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>目标探测</h2>
          <button id="probe-btn" class="btn" type="button">探测</button>
        </div>
        <p class="hint">输入域名或 IP，不带协议、路径或端口。</p>
        <div class="probe-form">
          <input
            id="target-input"
            class="input"
            type="text"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="example.com 或 1.1.1.1"
            aria-label="探测目标"
          />
          <label class="field-inline">
            <span class="field-label">次数</span>
            <input
              id="probe-count"
              class="input input-number"
              type="number"
              inputmode="numeric"
              min="1"
              max="20"
              step="1"
              value="1"
              aria-label="探测次数（1-20，默认 1）"
            />
          </label>
          <label class="field-inline">
            <span class="field-label">超时</span>
            <input
              id="probe-timeout"
              class="input input-number"
              type="number"
              inputmode="numeric"
              min="1000"
              max="30000"
              step="500"
              value="3000"
              aria-label="超时毫秒（1000-30000，默认 3000）"
            />
            <span class="field-label">ms</span>
          </label>
          <label class="checkbox">
            <input id="force-ipv4" type="checkbox" />
            <span>仅 IPv4</span>
          </label>
        </div>
        <div id="probe-output" class="output"></div>
      </section>
    </main>

    <footer class="app-footer">
      <p>仅用于网络诊断与授权测试</p>
    </footer>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
